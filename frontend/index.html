<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Senthil Enterprises ERP</title>

  <!-- Tailwind CSS & Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/css/tailwind-config.js"></script>

  <!-- Debug Mode -->
  <script src="scripts/debug_overlay.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  
  <!-- SheetJS (Excel Import) -->
  <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- JsBarcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>

  <!-- Global Custom Styles -->
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/global-system.css">
</head>
<body class="bg-bg text-text antialiased">
  
  <!-- Application Shell Root (Phase 4 Step 1: AppLayout) -->
  <div id="app-root"></div>

  <!-- Modals, Toasts, and Overlays -->
  <div id="overlay-root"></div>
  <div id="print-receipt-area" class="print-only hidden"></div>
  <div id="print-barcode-area" class="print-only hidden flex-col items-center justify-center">
    <svg id="barcode"></svg>
    <div id="barcode-text" class="text-xs font-bold mt-1"></div>
  </div>

  <!-- Global Application Entry Point -->
  <script type="module" src="app.js"></script>
</body>
</html>
